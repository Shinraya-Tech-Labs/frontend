name: CI Verification

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "SHINRAYA LABS"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "SHINRAYA LABS/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
